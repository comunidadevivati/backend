name: Deploy Cloudflare Backend

on:
  workflow_dispatch:
    inputs:
      application:
        description: Aplicação que será publicada
        required: true
        type: choice
        options:
          - bff
          - core-api

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ inputs.application }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.application }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare Workers
        run: pnpm run cloudflare:typecheck

      - name: Deploy BFF
        if: inputs.application == 'bff'
        run: pnpm run cloudflare:deploy:bff
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Core API
        if: inputs.application == 'core-api'
        run: pnpm run cloudflare:deploy:core-api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
