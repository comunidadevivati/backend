name: Backend CI

on:
  # main publica produção e homologation publica HML no Render (autoDeployTrigger: checksPass).
  push:
    branches: [main, homologation]
  # Sem filtro de caminhos: os checks são obrigatórios na homologation, inclusive no PR que sincroniza
  # a release da main (que só altera CHANGELOG.md e o manifesto). O PR de release, aberto pelo
  # GITHUB_TOKEN, não dispara workflows e é mesclado pelo próprio Release Please.
  pull_request:
    branches: [main, homologation]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fluxo: feat|fix|hotfix|release|renovate -> homologation -> main.
      # A main só recebe a homologation e o PR de release gerado pelo Release Please.
      - name: Validar nome da branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ "$BASE_BRANCH" == "main" ]]; then
            if [[ "$BRANCH_NAME" == "homologation" ]] ||
               [[ "$BRANCH_NAME" =~ ^release-please--branches--main(--.+)?$ ]]; then
              echo "Branch permitida para main: $BRANCH_NAME"
            else
              echo "::error::A main só aceita PRs da branch homologation: $BRANCH_NAME"
              exit 1
            fi
          elif [[ "$BRANCH_NAME" =~ ^(feat|fix|hotfix)/[a-z0-9][a-z0-9._-]*$ ]] ||
               [[ "$BRANCH_NAME" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
               [[ "$BRANCH_NAME" =~ ^renovate/.+$ ]] ||
               [[ "$BRANCH_NAME" == "main" ]]; then
            echo "Branch permitida para $BASE_BRANCH: $BRANCH_NAME"
          else
            echo "::error::Nome de branch inválido: $BRANCH_NAME"
            echo "Use feat/, fix/, hotfix/ ou release/X.Y.Z (ou main, para sincronizar)."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality Gates
        run: pnpm check:ci

  security:
    name: Gitleaks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --no-banner --redact .

  container-images:
    name: Container Images
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build BFF image
        run: docker build --file apps/bff/Dockerfile --tag comvivati/bff:ci .

      - name: Build Core API image
        run: docker build --file apps/core-api/Dockerfile --tag comvivati/core-api:ci .

  audit:
    name: Daily Dependency Audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit
