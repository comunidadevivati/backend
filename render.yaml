services:
  - type: web
    name: comvivati-core-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/core-api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'

  - type: web
    name: comvivati-bff
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/bff/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BFF_PORT
        value: '10000'
      - key: BFF_BASE_URL
        value: https://comunidade-viva-web.comvivati.workers.dev
      - key: WEB_BASE_URL
        value: https://comunidade-viva-web.comvivati.workers.dev
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
