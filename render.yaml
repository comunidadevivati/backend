# Blueprint de produção (ADR 0011): ligado à branch main. A homologação tem o próprio Blueprint,
# em render.homologation.yaml, ligado à branch homologation.
services:
  - type: web
    name: comvivati-core-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/core-api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      # Mesmo banco Neon do BFF do ambiente; a Core API usa o schema organization.
      - key: DATABASE_URL
        sync: false
      # Credencial de serviço do BFF (ADR 0006), lida pelo BFF via fromService.
      - key: CORE_API_TOKEN
        generateValue: true
      # Galeria (ADR 0010): bucket único do R2, cada ambiente na sua pasta. Endpoint e credenciais
      # (token do R2 restrito ao bucket) são preenchidos no painel antes do deploy.
      - key: MEDIA_STORAGE
        value: s3
      - key: MEDIA_S3_ENDPOINT
        sync: false
      - key: MEDIA_S3_REGION
        value: auto
      - key: MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_BUCKET
        value: comunidade-viva-media
      - key: MEDIA_KEY_PREFIX
        value: prod

  - type: web
    name: comvivati-bff
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/bff/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BFF_PORT
        value: '10000'
      - key: BFF_BASE_URL
        value: https://comvivaeficaz.com.br
      - key: WEB_BASE_URL
        value: https://comvivaeficaz.com.br
      - key: COOKIE_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Comunidade Viva e Eficaz <seguranca@mail.comvivaeficaz.com.br>
      - key: PASSWORD_RESET_TTL_MINUTES
        value: '15'
      - key: PASSWORD_RESET_COOLDOWN_SECONDS
        value: '60'
      - key: EMAIL_SEND_TIMEOUT_MS
        value: '5000'
      - key: CORE_API_URL
        value: https://comvivati-core-api.onrender.com
      - key: CORE_API_TOKEN
        fromService:
          type: web
          name: comvivati-core-api
          envVarKey: CORE_API_TOKEN
