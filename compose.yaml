name: comunidade-viva

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: comunidade_viva
      POSTGRES_USER: comunidade_viva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Obrigatório}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comunidade_viva -d comunidade_viva']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
