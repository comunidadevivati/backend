name: comunidade-viva

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: comunidade_viva
      POSTGRES_USER: comunidade_viva
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Obrigatório}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U comunidade_viva -d comunidade_viva']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # Emulador S3 local da galeria (ADR 0010), no lugar do Cloudflare R2: não consome a cota nem exige
  # credenciais reais. O bucket é um diretório criado ao subir. Credenciais só de desenvolvimento.
  media:
    image: versity/versitygw:v1.8.0
    restart: unless-stopped
    entrypoint: ['sh', '-c']
    command:
      - mkdir -p /data/comunidade-viva-media &&
        exec versitygw posix /data
    environment:
      ROOT_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY_ID:-viva-dev-access}
      ROOT_SECRET_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY:-viva-dev-secret-key}
      VGW_REGION: us-east-1
      # Navegador envia direto ao bucket (PUT pré-assinado) a partir do Vite.
      VGW_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - '127.0.0.1:9000:7070'
    volumes:
      - media_data:/data
    networks:
      - backend

  # Perfil "app": sobe as mesmas imagens publicadas no Render (docker compose --profile app up).
  # Usa as portas do `pnpm dev:bff`/`dev:api`; não rode os dois modos ao mesmo tempo.
  bff:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    env_file:
      - path: apps/bff/.env.local
        required: false
    environment:
      BFF_PORT: '10000'
      BFF_BASE_URL: http://localhost:3000
      WEB_BASE_URL: http://localhost:5173
      DATABASE_URL: postgresql://comunidade_viva:${POSTGRES_PASSWORD:?Obrigatório}@postgres:5432/comunidade_viva
      CORE_API_URL: http://core-api:10000
      CORE_API_TOKEN: ${CORE_API_TOKEN:-}
    ports:
      - '127.0.0.1:3000:10000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  core-api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    environment:
      PORT: '10000'
      DATABASE_URL: postgresql://comunidade_viva:${POSTGRES_PASSWORD:?Obrigatório}@postgres:5432/comunidade_viva
      CORE_API_TOKEN: ${CORE_API_TOKEN:-}
    ports:
      - '127.0.0.1:3001:10000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  media_data:
